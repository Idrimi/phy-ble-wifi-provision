[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "rpi-wifi-provision"
version = "0.1.0"
description = "BLE Wi‑Fi provisioning daemon for Raspberry Pi Zero 2 W"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "wifi_provision" }]

[tool.poetry.dependencies]
python = "^3.11"
dbus-next = "^0.2.3"
python-networkmanager = "^2.3"
anyio = "^4.0"

[tool.poetry.scripts]
wifi-provisiond = "wifi_provision.daemon:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
mypy = "^1.10"
ruff = "^0.4"
